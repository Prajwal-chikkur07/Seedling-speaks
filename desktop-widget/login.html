<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SeedlingSpeaks — Sign In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg: #FAF8F4;
      --ink: #1a0f00;
      --saffron: #E8820C;
      --gold: #c9a84c;
      --muted: #8C7B6B;
      --border: rgba(90,70,50,0.12);
      --border-warm: rgba(90,70,50,0.20);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      text-align: center;
      max-width: 380px;
      padding: 48px 36px;
    }

    .logo {
      width: 64px; height: 64px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: white;
      box-shadow: 0 4px 24px rgba(28,25,23,0.10);
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .sign-in-btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .sign-in-btn:hover {
      background: #2d1a00;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(28,25,23,0.15);
    }
    .sign-in-btn:active {
      transform: translateY(0);
    }

    .sign-in-btn svg {
      width: 18px; height: 18px;
    }

    .waiting {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
    }
    .waiting.visible { display: flex; }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .waiting-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .features {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .feature-tag {
      font-size: 11px;
      color: var(--muted);
      background: rgba(90,70,50,0.06);
      border-radius: 8px;
      padding: 5px 12px;
    }

    .footer {
      margin-top: 32px;
      font-size: 10px;
      color: rgba(90,70,50,0.25);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="icon.png" class="logo">
    <h1 class="title">SeedlingSpeaks Widget</h1>
    <p class="subtitle">
      Sign in with your SeedlingSpeaks account to<br>
      enable push-to-talk translation on your Mac
    </p>

    <button class="sign-in-btn" id="signInBtn">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      Sign in with Browser
    </button>

    <div class="waiting" id="waitingState">
      <div class="spinner"></div>
      <span class="waiting-text">
        Waiting for sign-in…<br>
        Complete the sign-in in your browser
      </span>
    </div>

    <div class="features">
      <span class="feature-tag">🎤 Push-to-Talk</span>
      <span class="feature-tag">🌐 10+ Languages</span>
      <span class="feature-tag">✨ AI Retoning</span>
      <span class="feature-tag">⌨️ Auto-Insert</span>
    </div>

    <p class="footer">Powered by Seedlinglabs · v2.5</p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const signInBtn = document.getElementById('signInBtn');
    const waitingState = document.getElementById('waitingState');

    signInBtn.addEventListener('click', () => {
      signInBtn.style.display = 'none';
      waitingState.classList.add('visible');
      ipcRenderer.send('open-browser-auth');
    });

    // If auth succeeds, main process will close this window
    ipcRenderer.on('auth-failed', () => {
      signInBtn.style.display = 'flex';
      waitingState.classList.remove('visible');
    });
  </script>
</body>
</html>
