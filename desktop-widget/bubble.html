<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --surface: #FDFAF4;
      --surface-ink: #1C1917;
      --saffron: #E8820C;
      --border-warm: rgba(90,70,50,0.20);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 180px; height: 40px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Idle pill ── */
    .pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-ink); 
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px; padding: 8px 18px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 8px rgba(255, 255, 255, 0.05);
      transition: all 0.15s ease;
      -webkit-app-region: no-drag; user-select: none;
      font-family: 'DM Sans', sans-serif;
      color: white;
    }
    .pill:hover { 
      transform: translateY(-1px); 
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7), 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .dots { display: flex; align-items: center; gap: 4px; }
    .dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--saffron);
    }

    /* ── Recording pill ── */
    .rec-pill {
      display: none;
      align-items: center; gap: 8px;
      background: var(--surface-ink); 
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px; padding: 7px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 8px rgba(255, 255, 255, 0.05);
      -webkit-app-region: no-drag; user-select: none;
      font-family: 'DM Sans', sans-serif;
    }

    /* animated dots */
    .rec-dots { display: flex; align-items: center; gap: 3px; }
    .rec-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #fff;
      animation: bounce 1.1s ease-in-out infinite;
    }
    .rec-dot:nth-child(1) { animation-delay: 0s; }
    .rec-dot:nth-child(2) { animation-delay: 0.18s; }
    .rec-dot:nth-child(3) { animation-delay: 0.36s; }
    .rec-dot:nth-child(4) { animation-delay: 0.54s; }
    .rec-dot:nth-child(5) { animation-delay: 0.72s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scaleY(1); opacity: 0.5; }
      40%            { transform: scaleY(1.8); opacity: 1; }
    }

    /* ── Processing pill ── */
    .proc-pill {
      display: none;
      align-items: center; gap: 8px;
      background: var(--surface-ink);
      border: 1px solid rgba(232,130,12,0.5);
      border-radius: 20px; padding: 7px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 12px rgba(232,130,12,0.2);
      -webkit-app-region: no-drag; user-select: none;
      font-family: 'DM Sans', sans-serif;
    }
    .proc-label {
      font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7);
      letter-spacing: 0.01em;
    }
    .proc-spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(232,130,12,0.3);
      border-top-color: #E8820C;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* icon buttons inside rec pill */
    .rec-btn {
      width: 22px; height: 22px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .rec-btn:hover { opacity: 0.75; transform: translateY(-1px); }
    .rec-btn.cancel { background: rgba(255,255,255,0.15); color: #fff; }
    .rec-btn.stop   { background: #fff; color: #111; }
  </style>
</head>
<body>
  <!-- Idle state -->
  <div class="pill" id="pill">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </div>

  <!-- Recording state -->
  <div class="rec-pill" id="recPill">
    <!-- X cancel -->
    <button class="rec-btn cancel" id="cancelBtn">
      <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- animated dots -->
    <div class="rec-dots">
      <div class="rec-dot"></div>
      <div class="rec-dot"></div>
      <div class="rec-dot"></div>
      <div class="rec-dot"></div>
      <div class="rec-dot"></div>
    </div>

    <!-- stop/submit -->
    <button class="rec-btn stop" id="stopBtn">
      <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
    </button>
  </div>

  <!-- Processing state -->
  <div class="proc-pill" id="procPill">
    <div class="proc-spinner"></div>
    <span class="proc-label">Processing…</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const pill     = document.getElementById('pill');
    const recPill  = document.getElementById('recPill');
    const procPill = document.getElementById('procPill');
    
    let isRecording = false;
    let mediaRecorder;
    let audioChunks = [];

    // Helper to switch UI — state: 'idle' | 'recording' | 'processing'
    function setUIState(state) {
      isRecording = state === 'recording';
      pill.style.display     = state === 'idle'       ? 'flex' : 'none';
      recPill.style.display  = state === 'recording'  ? 'flex' : 'none';
      procPill.style.display = state === 'processing' ? 'flex' : 'none';
    }

    // ── Drag on idle pill ──
    let isDragging = false, hasMoved = false;
    let dragStartX, dragStartY, winStartX, winStartY;

    pill.addEventListener('mousedown', async (e) => {
      isDragging = true; hasMoved = false;
      dragStartX = e.screenX; dragStartY = e.screenY;
      const pos = await ipcRenderer.invoke('get-bubble-pos');
      winStartX = pos.x; winStartY = pos.y;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - dragStartX, dy = e.screenY - dragStartY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
      ipcRenderer.send('bubble-drag', { x: winStartX + dx, y: winStartY + dy });
    });
    window.addEventListener('mouseup', () => {
      if (isDragging && !hasMoved) {
        if (!isRecording) startRecording();
      }
      isDragging = false;
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          setUIState('processing');
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const arrayBuffer = await audioBlob.arrayBuffer();
          const buffer = Buffer.from(arrayBuffer);
          ipcRenderer.send('process-audio', buffer);
        };

        mediaRecorder.start();
        setUIState('recording');
      } catch (err) {
        console.error('Recording failed:', err);
        setUIState('idle');
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    }

    document.getElementById('cancelBtn').addEventListener('click', () => {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      setUIState(false);
      ipcRenderer.send('cancel-recording');
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      stopRecording();
    });

    ipcRenderer.on('toggle-recording', (event, active) => {
      if (active && !isRecording) {
        startRecording();
      } else if (!active && isRecording) {
        stopRecording();
      }
    });

    ipcRenderer.on('recording-state', (_, recording) => {
      setUIState(recording ? 'recording' : 'idle');
    });

    ipcRenderer.on('processing-state', (_, active) => {
      if (active) setUIState('processing');
    });

    ipcRenderer.on('processing-done', () => {
      setUIState('idle');
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('show-bubble-menu');
    });
  </script>
</body>
</html>
