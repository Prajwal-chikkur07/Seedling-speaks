databases:
  - name: seedlingspeaks-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: seedlingspeaks-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      # Wired automatically from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: seedlingspeaks-db
          property: connectionString

      # Clerk token verification (the JWKS URL is derived from this key)
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Comma-separated browser origins allowed by CORS, e.g. https://your-frontend.example.com
      - key: ALLOWED_ORIGINS
        sync: false

      # Required keys — entered in dashboard at first deploy
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

      # Optional — enter only if you use these features
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_REWRITE_MODEL
        value: google/gemini-2.5-flash
      - key: LMNT_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_PERSON_URN
        sync: false
